<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geometric Interior</title>
    <meta name="description" content="Generate abstract geometric still images: luminous translucent planes, light points, and glow, rendered with WebGL.">
    <script>
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='18' height='18' rx='2' fill='%23b482ff' opacity='.35' transform='rotate(-12 12 18)'/%3E%3Crect x='11' y='5' width='18' height='18' rx='2' fill='%23b482ff' opacity='.55' transform='rotate(8 20 14)'/%3E%3Crect x='7' y='7' width='16' height='16' rx='2' fill='%23b482ff' opacity='.9' transform='rotate(-3 15 15)'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "@memeticode/geometric-interior": "./vendor/geometric-interior/index.js",
            "three": "./vendor/three/three.module.min.js",
            "postprocessing": "./vendor/postprocessing/index.js"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</head>
<body>
    <header class="app-header">
        <h1>Geometric Interior</h1>
        <fieldset class="theme-switch" id="theme">
            <legend class="sr-only">Theme</legend>
            <label><input type="radio" name="theme" value="system"><span>System</span></label>
            <label><input type="radio" name="theme" value="light"><span>Light</span></label>
            <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
        </fieldset>
    </header>

    <main>
        <form id="controls" class="sidebar">
            <div class="sidebar-scroll">
                <details class="section" open>
                    <summary>Output</summary>
                    <div class="fields">
                        <label>Language
                            <select name="locale">
                                <option value="en">English</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                                <option value="it">Italiano</option>
                                <option value="zh">中文</option>
                                <option value="ru">Русский</option>
                            </select>
                        </label>
                        <label>Aspect
                            <select name="aspect">
                                <option>20:13</option><option>16:9</option><option>3:2</option>
                                <option>4:3</option><option>1:1</option><option>3:4</option>
                                <option>2:3</option><option>9:16</option><option>13:20</option>
                            </select>
                        </label>
                        <label>Height (px)
                            <input name="height" type="number" min="1" max="4096" step="1" required>
                        </label>
                    </div>
                </details>
                <div class="actions randomize-row">
                    <button type="button" id="randomize" class="primary">Randomize</button>
                </div>
                <div id="sections"></div>
            </div>
        </form>

        <section class="stage" aria-label="Image">
            <p id="status" class="status" role="status">Rendering…</p>
            <figure hidden>
                <img id="image" alt="">
                <figcaption>
                    <h2 id="title"></h2>
                    <p id="short"></p>
                    <details>
                        <summary>Full description</summary>
                        <p id="long"></p>
                    </details>
                    <div class="actions">
                        <a id="download" class="button" download>Download PNG</a>
                        <button type="button" id="copy-link">Copy link</button>
                    </div>
                </figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
