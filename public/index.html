<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geometric Interior</title>
    <meta name="description" content="Generate abstract geometric still images: luminous translucent planes, light points, and glow, rendered with WebGL.">
    <script>
        // Runs before first paint: apply the saved theme, and pick the page
        // language (shared link, then saved choice, then browser language).
        // Non-English pages stay hidden until their strings load, so English
        // never flashes first; the timeout reveals the page regardless.
        (() => {
            const root = document.documentElement;
            const supported = ['en', 'es', 'fr', 'it', 'zh', 'ru'];
            let theme, saved, linked;
            try {
                theme = localStorage.getItem('theme');
                saved = localStorage.getItem('locale');
            } catch {}
            try {
                linked = JSON.parse(decodeURIComponent(location.hash.slice(1))).locale;
            } catch {}
            if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
            const browser = (navigator.languages || [navigator.language])
                .map(l => String(l).slice(0, 2).toLowerCase());
            const locale = [linked, saved, ...browser].find(l => supported.includes(l)) || 'en';
            root.dataset.locale = locale;
            if (locale !== 'en') {
                root.classList.add('i18n-pending');
                setTimeout(() => root.classList.remove('i18n-pending'), 3000);
            }
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='18' height='18' rx='2' fill='%23b482ff' opacity='.35' transform='rotate(-12 12 18)'/%3E%3Crect x='11' y='5' width='18' height='18' rx='2' fill='%23b482ff' opacity='.55' transform='rotate(8 20 14)'/%3E%3Crect x='7' y='7' width='16' height='16' rx='2' fill='%23b482ff' opacity='.9' transform='rotate(-3 15 15)'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "@memeticode/geometric-interior": "./vendor/geometric-interior/index.js",
            "three": "./vendor/three/three.module.min.js",
            "postprocessing": "./vendor/postprocessing/index.js"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1>Geometric Interior</h1>
            <button type="button" class="link-button" id="open-statement" aria-haspopup="dialog" data-i18n="header.statement">Artist statement</button>
        </div>
        <div class="header-controls">
            <select name="locale" form="controls" class="locale-select" aria-label="Language" data-i18n-aria-label="header.language">
                <option value="en" lang="en">English</option>
                <option value="es" lang="es">Español</option>
                <option value="fr" lang="fr">Français</option>
                <option value="it" lang="it">Italiano</option>
                <option value="zh" lang="zh-Hans">中文</option>
                <option value="ru" lang="ru">Русский</option>
            </select>
            <fieldset class="theme-switch" id="theme">
                <legend class="sr-only" data-i18n="header.theme">Theme</legend>
                <label><input type="radio" name="theme" value="system"><span data-i18n="header.system">System</span></label>
                <label><input type="radio" name="theme" value="light"><span data-i18n="header.light">Light</span></label>
                <label><input type="radio" name="theme" value="dark"><span data-i18n="header.dark">Dark</span></label>
            </fieldset>
        </div>
    </header>

    <main>
        <form id="controls" class="sidebar">
            <div class="sidebar-scroll">
                <div id="sections"></div>
            </div>
        </form>

        <section class="stage" aria-label="Image" data-i18n-aria-label="stage.label">
            <!-- The fields belong to the sidebar form via form="controls". -->
            <div class="toolbar" id="toolbar">
                <div class="toolbar-fields">
                    <label><span data-i18n="output.aspect">Aspect</span>
                        <select name="aspect" form="controls">
                            <option>20:13</option><option>16:9</option><option>3:2</option>
                            <option>4:3</option><option>1:1</option><option>3:4</option>
                            <option>2:3</option><option>9:16</option><option>13:20</option>
                        </select>
                    </label>
                    <label><span data-i18n="output.height">Height (px)</span>
                        <input name="height" form="controls" type="number" min="1" max="4096" step="1" required>
                    </label>
                </div>
                <div class="toolbar-actions">
                    <button type="button" id="randomize" class="primary" data-i18n="actions.randomize">Randomize</button>
                    <a id="download" class="button" download aria-disabled="true" data-i18n="actions.download">Download PNG</a>
                    <button type="button" id="copy-link" data-i18n="actions.copyLink">Copy link</button>
                </div>
            </div>
            <p id="status" class="status" role="status"></p>
            <figure hidden>
                <img id="image" alt="">
                <figcaption>
                    <h2 id="title"></h2>
                    <p id="short"></p>
                    <details>
                        <summary data-i18n="caption.fullDescription">Full description</summary>
                        <p id="long"></p>
                    </details>
                </figcaption>
            </figure>
        </section>
    </main>

    <dialog id="statement" class="modal" aria-labelledby="statement-title">
        <div class="modal-header">
            <h2 id="statement-title" data-i18n="statement.title">Artist statement</h2>
            <button type="button" class="modal-close" aria-label="Close" data-i18n-aria-label="modal.close">&times;</button>
        </div>
        <!-- Filled from the locale files (statement.paragraphs). -->
        <div class="modal-body"></div>
    </dialog>
</body>
</html>
